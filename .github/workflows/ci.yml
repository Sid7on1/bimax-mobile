name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          npm_config_build_from_source: "true"
      - run: npm ls react-native-reanimated react-native-worklets --all
      - run: npm run check
      - run: npm exec --workspace apps/mobile -- expo export --platform android --platform ios --output-dir /tmp/bimax-native-export
